[general]
import = ["~/.config/alacritty/rose-pine.toml"]

[env]
TERM = "alacritty"

[font]
size = 12

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[scrolling]
history = 10000
multiplier = 3

[window]
opacity = 0.93
startup_mode = "Maximized"

[mouse]
hide_when_typing = true
