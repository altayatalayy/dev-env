name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Run unit tests
        run: zig build test --summary all

      - name: Build binaries
        run: zig build

      - name: Lint shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install --yes shellcheck
          fi
          find install.sh release test/scripts test/e2e -name '*.sh' -print0 \
              | xargs -0 shellcheck
