name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

# zig-cli and zig-graph are declared as URL dependencies in build.zig.zon, so
# `zig build` fetches them automatically; CI does not check them out.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              version="${INPUT_VERSION}"
          else
              version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid release version: ${version}" >&2
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          tag_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | cut -f1)"
          if [ -z "${tag_commit}" ]; then
              tag_commit="$(git ls-remote origin "refs/tags/${tag}" | cut -f1)"
          fi
          if [ -n "${tag_commit}" ] && [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
              echo "${tag} points to ${tag_commit}, not the checked-out commit ${GITHUB_SHA}" >&2
              exit 1
          fi

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build release artifacts
        env:
          DEV_ENV_RELEASE: ${{ steps.version.outputs.version }}
        run: release/build.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          assets_dir="build/releases/download/${tag}"
          if [ ! -d "${assets_dir}" ]; then
              echo "missing release assets: ${assets_dir}" >&2
              exit 1
          fi
          if ! gh release view "${tag}" >/dev/null 2>&1; then
              gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
          fi
          gh release upload "${tag}" "${assets_dir}"/* --clobber
